<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가상은행 에이전트</title>
<style>
  :root {
    --canvas: #F7F6F3; --surface: #FFFFFF; --line: #EAEAEA;
    --text: #2F3437; --muted: #787774; --primary: #111111; --on-primary: #FFFFFF;
    --warn-bg: #FBF3DB; --warn-text: #956400;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #191919; --surface: #202020; --line: #2F2F2F;
      --text: #E6E6E4; --muted: #9B9A97; --primary: #E6E6E4; --on-primary: #191919;
      --warn-bg: #35301C; --warn-text: #D9B45A;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: var(--canvas); color: var(--text);
    font-family: "Geist", "SF Pro Display", "Pretendard", "Noto Sans KR", sans-serif;
    display: flex; justify-content: center; padding: 24px;
  }
  .app {
    width: 100%; max-width: 760px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px;
    display: flex; flex-direction: column; height: calc(100dvh - 48px);
  }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  header b { font-size: 14px; font-weight: 500; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 9999px; background: var(--warn-bg); color: var(--warn-text); }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  #log > * { flex-shrink: 0; }    /* 대화가 길어져도 말풍선·카드가 눌려 잘리지 않게 */
  .msg { font-size: 13px; line-height: 1.6; white-space: pre-wrap; max-width: 85%; }
  .me { align-self: flex-end; background: var(--canvas); border: 1px solid var(--line); padding: 8px 12px; border-radius: 12px; }
  .bot { align-self: flex-start; }
  .notice { align-self: flex-start; font-size: 12px; color: var(--muted); }
  form { display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }
  input {
    flex: 1; font: inherit; font-size: 13px; padding: 9px 12px; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  }
  button {
    font: inherit; font-size: 13px; padding: 0 16px; border: none; border-radius: 6px;
    background: var(--primary); color: var(--on-primary); cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }

  /* 처리안 확인 카드 (2단계) */
  .mono { font-family: "Geist Mono", "SF Mono", "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
  .card { align-self: flex-start; width: 100%; max-width: 440px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--canvas); border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 500; }
  .card-head .badge { margin-left: auto; font-weight: 400; }
  .card-body { padding: 12px 14px; }
  .task { font-size: 12px; color: var(--muted); }
  .amount { font-size: 22px; font-weight: 500; letter-spacing: -.02em; margin: 2px 0 8px; }
  .amount small { font-size: 13px; font-family: inherit; margin-left: 2px; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; padding: 4px 0; }
  .row span:first-child { color: var(--muted); white-space: nowrap; }
  .row span:last-child { text-align: right; }
  .warn { font-size: 12px; line-height: 1.5; background: var(--warn-bg); color: var(--warn-text); border-radius: 6px; padding: 7px 9px; margin-top: 8px; }
  .actions { display: flex; gap: 6px; margin-top: 12px; }
  .actions button { padding: 8px 12px; }
  .actions .primary { flex: 1; }
  .actions .ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  .done-badge { background: var(--canvas); color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header><b>가상은행 에이전트</b><span class="badge">가상 데이터</span></header>
  <div id="log">
    <div class="msg bot">무엇을 도와드릴까요? 예: 내 계좌 목록과 잔액 보여줘</div>
  </div>
  <form id="form">
    <input id="text" autocomplete="off" placeholder="요청을 입력하세요">
    <button id="send">보내기</button>
  </form>
</div>
<script src="/static/app.js"></script>
</body>
</html>

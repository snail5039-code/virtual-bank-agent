<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가상은행 회원가입</title>
<style>
  /* 색은 index.html 과 같습니다 */
  :root {
    --canvas: #F7F6F3; --surface: #FFFFFF; --line: #EAEAEA;
    --text: #2F3437; --muted: #787774; --primary: #111111; --on-primary: #FFFFFF;
    --bad-bg: #FDEBEC; --bad-text: #9F2F2D;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #191919; --surface: #202020; --line: #2F2F2F;
      --text: #E6E6E4; --muted: #9B9A97; --primary: #E6E6E4; --on-primary: #191919;
      --bad-bg: #3A2224; --bad-text: #E8A09C;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: var(--canvas); color: var(--text);
    font-family: "Geist", "SF Pro Display", "Pretendard", "Noto Sans KR", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  form { width: 320px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 17px; font-weight: 500; margin: 0 0 2px; }
  p { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  label { font-size: 12px; color: var(--muted); }
  input {
    font: inherit; font-size: 13px; padding: 10px 12px; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  }
  button {
    font: inherit; font-size: 13px; padding: 10px 12px; margin-top: 6px; cursor: pointer;
    background: var(--primary); color: var(--on-primary); border: 0; border-radius: 6px;
  }
  button:disabled { opacity: .5; cursor: default; }
  .switch { margin: 6px 0 0; text-align: center; }
  .switch a { color: var(--text); }
  #error { font-size: 12px; background: var(--bad-bg); color: var(--bad-text); border-radius: 6px; padding: 7px 9px; }
</style>
</head>
<body>
<form id="form">
  <h1>회원가입</h1>
  <p>계좌·카드 없이 시작합니다. 가입하면 바로 로그인됩니다.</p>
  <label for="name">이름</label>
  <input id="name" required autofocus>
  <label for="phone">휴대전화번호</label>
  <input id="phone" placeholder="010-1234-5678" required>
  <label for="login_id">아이디</label>
  <input id="login_id" placeholder="영어 소문자·숫자 4~20자" autocomplete="username" required>
  <label for="password">비밀번호</label>
  <input id="password" type="password" placeholder="8자 이상" autocomplete="new-password" required>
  <label for="pin">PIN (본인 확인용 숫자 4자리)</label>
  <input id="pin" type="password" inputmode="numeric" maxlength="4" required>
  <label for="ssn_tail">주민등록번호 뒷자리 (본인 확인용 숫자 7자리)</label>
  <input id="ssn_tail" type="password" inputmode="numeric" maxlength="7" required>
  <div id="error" hidden></div>
  <button id="submit">가입하기</button>
  <p class="switch">이미 아이디가 있으면 <a href="/login">로그인</a></p>
</form>
<script>
// 적은 값을 /api/signup 에 보냅니다. 검사는 서버가 하고, 안 되면 사유를 보여줍니다.
// 가입되면 서버가 로그인 쿠키까지 주므로 바로 첫 화면(/)으로 갑니다.
const form = document.getElementById("form");
const error = document.getElementById("error");
const submit = document.getElementById("submit");
const value = (id) => document.getElementById(id).value;

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  submit.disabled = true;
  error.hidden = true;
  const res = await fetch("/api/signup", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: value("name"), phone: value("phone"), login_id: value("login_id"),
                           password: value("password"), pin: value("pin"), ssn_tail: value("ssn_tail") }),
  });
  if (res.ok) {
    location.href = "/";
    return;
  }
  error.textContent = (await res.json()).error || "가입하지 못했습니다.";
  error.hidden = false;
  submit.disabled = false;
});
</script>
</body>
</html>

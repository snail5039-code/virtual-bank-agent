<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가상은행 로그인</title>
<style>
  /* 색은 index.html 과 같습니다 */
  :root {
    --canvas: #F7F6F3; --surface: #FFFFFF; --line: #EAEAEA;
    --text: #2F3437; --muted: #787774; --primary: #111111; --on-primary: #FFFFFF;
    --bad-bg: #FDEBEC; --bad-text: #9F2F2D;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #191919; --surface: #202020; --line: #2F2F2F;
      --text: #E6E6E4; --muted: #9B9A97; --primary: #E6E6E4; --on-primary: #191919;
      --bad-bg: #3A2224; --bad-text: #E8A09C;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: var(--canvas); color: var(--text);
    font-family: "Geist", "SF Pro Display", "Pretendard", "Noto Sans KR", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  form { width: 320px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 17px; font-weight: 500; margin: 0 0 2px; }
  p { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  label { font-size: 12px; color: var(--muted); }
  input {
    font: inherit; font-size: 13px; padding: 10px 12px; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  }
  button {
    font: inherit; font-size: 13px; padding: 10px 12px; margin-top: 6px; cursor: pointer;
    background: var(--primary); color: var(--on-primary); border: 0; border-radius: 6px;
  }
  button:disabled { opacity: .5; cursor: default; }
  .switch { margin: 6px 0 0; text-align: center; }
  .switch a { color: var(--text); }
  #error { font-size: 12px; background: var(--bad-bg); color: var(--bad-text); border-radius: 6px; padding: 7px 9px; }
</style>
</head>
<body>
<form id="form">
  <h1>가상은행</h1>
  <p>로그인하고 이용하세요</p>
  <label for="login_id">아이디</label>
  <input id="login_id" autocomplete="username" required autofocus>
  <label for="password">비밀번호</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <div id="error" hidden></div>
  <button id="submit">로그인</button>
  <p class="switch">처음이면 <a href="/signup">회원가입</a></p>
</form>
<script>
// 아이디·비밀번호를 /api/login 에 보내고, 맞으면 서버가 준 쿠키를 가지고 첫 화면(/)으로 갑니다.
const form = document.getElementById("form");
const error = document.getElementById("error");
const submit = document.getElementById("submit");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  submit.disabled = true;
  error.hidden = true;
  const res = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      login_id: document.getElementById("login_id").value,
      password: document.getElementById("password").value,
    }),
  });
  if (res.ok) {
    location.href = "/";
    return;
  }
  error.textContent = (await res.json()).error || "로그인하지 못했습니다.";
  error.hidden = false;
  document.getElementById("password").value = "";
  submit.disabled = false;
});
</script>
</body>
</html>

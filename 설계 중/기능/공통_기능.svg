<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="900" viewBox="0 0 1420 900" font-family="Malgun Gothic, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#1f4e79">공통 노드 (19개)</text>
<path d="M565.0,95.0 V117.5 H205.0 V117.5 L205.0,140.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M565.0,95.0 L565.0,140.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M565.0,95.0 V117.5 H925.0 V117.5 L925.0,140.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M565.0,95.0 V180.0 H205.0 V180.0 L205.0,265.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M565.0,95.0 L565.0,265.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M565.0,95.0 V180.0 H925.0 V180.0 L925.0,265.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="465" y="45" width="200" height="50" rx="2" fill="#fff2cc" stroke="#333" stroke-width="1"/>
<text x="565.0" y="67.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">공통 노드</text>
<text x="565.0" y="81.0" font-size="11" fill="#000000" text-anchor="middle">(agent 아님)</text>
<rect x="40" y="140" width="330" height="95" rx="2" fill="#fff2cc" stroke="#333" stroke-width="1"/>
<text x="205.0" y="163.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">대상 찾기</text>
<text x="205.0" y="177.5" font-size="11" fill="#000000" text-anchor="middle">승인 대기 판정    common_pending_check</text>
<text x="205.0" y="191.5" font-size="11" fill="#000000" text-anchor="middle">맥락 확인         common_check_context</text>
<text x="205.0" y="205.5" font-size="11" fill="#000000" text-anchor="middle">사용자 확인       common_confirm_target</text>
<text x="205.0" y="219.5" font-size="11" fill="#000000" text-anchor="middle">대상 해소         common_resolve_target</text>
<rect x="400" y="140" width="330" height="95" rx="2" fill="#fff2cc" stroke="#333" stroke-width="1"/>
<text x="565.0" y="170.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">정보 채우기</text>
<text x="565.0" y="184.5" font-size="11" fill="#000000" text-anchor="middle">인증              common_authenticate</text>
<text x="565.0" y="198.5" font-size="11" fill="#000000" text-anchor="middle">부족 정보 질문    common_ask_missing_information</text>
<text x="565.0" y="212.5" font-size="11" fill="#000000" text-anchor="middle">처리안 제시       common_propose</text>
<rect x="760" y="140" width="330" height="95" rx="2" fill="#fff2cc" stroke="#333" stroke-width="1"/>
<text x="925.0" y="163.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">승인</text>
<text x="925.0" y="177.5" font-size="11" fill="#000000" text-anchor="middle">승인              common_approve</text>
<text x="925.0" y="191.5" font-size="11" fill="#000000" text-anchor="middle">응답 해석         common_interpret_response</text>
<text x="925.0" y="205.5" font-size="11" fill="#000000" text-anchor="middle">승인 전 수정      common_revise</text>
<text x="925.0" y="219.5" font-size="11" fill="#000000" text-anchor="middle">실행 직전 재검증  common_revalidate</text>
<rect x="40" y="265" width="330" height="90" rx="2" fill="#fff2cc" stroke="#333" stroke-width="1"/>
<text x="205.0" y="293.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">마무리</text>
<text x="205.0" y="307.0" font-size="11" fill="#000000" text-anchor="middle">저장              common_save</text>
<text x="205.0" y="321.0" font-size="11" fill="#000000" text-anchor="middle">결과 안내         common_report</text>
<text x="205.0" y="335.0" font-size="11" fill="#000000" text-anchor="middle">처리 기록         common_log_request</text>
<rect x="400" y="265" width="330" height="90" rx="2" fill="#fff2cc" stroke="#333" stroke-width="1"/>
<text x="565.0" y="293.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">실패 · 예외</text>
<text x="565.0" y="307.0" font-size="11" fill="#000000" text-anchor="middle">불가 안내         common_reject</text>
<text x="565.0" y="321.0" font-size="11" fill="#000000" text-anchor="middle">오류 / 복구       common_error</text>
<text x="565.0" y="335.0" font-size="11" fill="#000000" text-anchor="middle">도메인 반송       common_reroute</text>
<rect x="760" y="265" width="330" height="90" rx="2" fill="#fff2cc" stroke="#333" stroke-width="1"/>
<text x="925.0" y="300.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">이어가기</text>
<text x="925.0" y="314.0" font-size="11" fill="#000000" text-anchor="middle">후속 결과 조회    common_query_history</text>
<text x="925.0" y="328.0" font-size="11" fill="#000000" text-anchor="middle">후속 업무 이어가기  common_next_task</text>
<rect x="1120" y="140" width="260" height="215" rx="2" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
<text x="1250.0" y="174.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">적용할 패턴</text>
<text x="1250.0" y="188.5" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="1250.0" y="202.5" font-size="11" fill="#000000" text-anchor="middle">CommonWorkflow</text>
<text x="1250.0" y="216.5" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="1250.0" y="230.5" font-size="11" fill="#000000" text-anchor="middle">HITL</text>
<text x="1250.0" y="244.5" font-size="11" fill="#000000" text-anchor="middle">  interrupt / resume</text>
<text x="1250.0" y="258.5" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="1250.0" y="272.5" font-size="11" fill="#000000" text-anchor="middle">checkpoint / recovery / retry</text>
<text x="1250.0" y="286.5" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="1250.0" y="300.5" font-size="11" fill="#000000" text-anchor="middle">* 공통은 supervisor의</text>
<text x="1250.0" y="314.5" font-size="11" fill="#000000" text-anchor="middle">  라우팅 대상이 아니다</text>
<text x="1250.0" y="328.5" font-size="11" fill="#000000" text-anchor="middle">  모든 흐름 중간에 끼어든다</text>
<rect x="40" y="390" width="660" height="155" rx="2" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
<text x="370.0" y="408.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">역할 구분  (헷갈리기 쉬운 3쌍)</text>
<text x="370.0" y="422.5" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="370.0" y="436.5" font-size="11" fill="#000000" text-anchor="middle">맥락 확인   : &quot;그 카드&quot;, &quot;아까 그 계좌&quot;가 무엇인지 이전 대화에서 찾는다</text>
<text x="370.0" y="450.5" font-size="11" fill="#000000" text-anchor="middle">사용자 확인 : 확신할 수 없거나 후보가 여러 개일 때 목록을 주고 고르게 한다</text>
<text x="370.0" y="464.5" font-size="11" fill="#000000" text-anchor="middle">대상 해소   : 소유자로 거른 뒤 이름을 맞춰 ID로 바꾼다</text>
<text x="370.0" y="478.5" font-size="11" fill="#000000" text-anchor="middle">              후보 0개 -&gt; 불가 안내 / 1개 -&gt; 확정 / 2개 이상 -&gt; 사용자 확인</text>
<text x="370.0" y="492.5" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="370.0" y="506.5" font-size="11" fill="#000000" text-anchor="middle">저장       : 파일에 쓴다. 실패할 수 있다</text>
<text x="370.0" y="520.5" font-size="11" fill="#000000" text-anchor="middle">결과 안내  : 저장이 성공했을 때만 완료를 말한다</text>
<text x="370.0" y="534.5" font-size="11" fill="#000000" text-anchor="middle">  * 두 개를 한 함수에 두면 저장 실패인데 완료를 출력하게 된다</text>
<rect x="730" y="390" width="650" height="155" rx="2" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
<text x="1055.0" y="422.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">인증</text>
<text x="1055.0" y="436.5" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="1055.0" y="450.5" font-size="11" fill="#000000" text-anchor="middle">한 번 인증하면 그 세션 동안 유효하다. 업무마다 다시 받지 않는다</text>
<text x="1055.0" y="464.5" font-size="11" fill="#000000" text-anchor="middle">  세션 = thread_id 하나 = 프로그램을 켜고 끌 때까지</text>
<text x="1055.0" y="478.5" font-size="11" fill="#000000" text-anchor="middle">인증은 처리안 제시 &quot;전&quot;에 받는다</text>
<text x="1055.0" y="492.5" font-size="11" fill="#000000" text-anchor="middle">  승인 직후에 두면 인증이 틀렸을 때 처리안을 다시 만들어야 한다</text>
<text x="1055.0" y="506.5" font-size="11" fill="#000000" text-anchor="middle">수단 : 계좌 비밀번호 / PIN / 휴대전화번호 / 주민번호 뒷자리 중 택일</text>
<text x="1055.0" y="520.5" font-size="11" fill="#000000" text-anchor="middle">재시작하면 인증은 풀린다. 복구 시점에 다시 받는다</text>
<rect x="40" y="575" width="660" height="130" rx="2" fill="#fff2cc" stroke="#333" stroke-width="1"/>
<text x="370.0" y="602.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">승인 규칙</text>
<text x="370.0" y="616.0" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="370.0" y="630.0" font-size="11" fill="#000000" text-anchor="middle">승인 노드에는 interrupt만 둔다. 다른 일을 넣지 않는다</text>
<text x="370.0" y="644.0" font-size="11" fill="#000000" text-anchor="middle">  재개하면 그 노드를 처음부터 다시 실행하기 때문이다</text>
<text x="370.0" y="658.0" font-size="11" fill="#000000" text-anchor="middle">자연어 응답을 승인 / 거절 / 취소 / 수정으로 매핑한다</text>
<text x="370.0" y="672.0" font-size="11" fill="#000000" text-anchor="middle">  확신할 수 없으면 되묻는다</text>
<text x="370.0" y="686.0" font-size="11" fill="#000000" text-anchor="middle">수정 시 바뀐 부분만 보여주지 않고 전체 내용을 다시 보여준다</text>
<rect x="730" y="575" width="650" height="130" rx="2" fill="#fff2cc" stroke="#333" stroke-width="1"/>
<text x="1055.0" y="609.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">checkpoint</text>
<text x="1055.0" y="623.0" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="1055.0" y="637.0" font-size="11" fill="#000000" text-anchor="middle">그래프를 compile할 때 checkpointer를 하나 붙인다</text>
<text x="1055.0" y="651.0" font-size="11" fill="#000000" text-anchor="middle">  노드마다 따로 두는 것이 아니다. 모든 노드 경계에서 자동 저장된다</text>
<text x="1055.0" y="665.0" font-size="11" fill="#000000" text-anchor="middle">실행 시 thread_id를 넘긴다. 대화 세션 하나 = thread_id 하나</text>
<text x="1055.0" y="679.0" font-size="11" fill="#000000" text-anchor="middle">subgraph를 노드로 등록하면 부모의 checkpointer를 물려받는다</text>
<rect x="40" y="735" width="660" height="115" rx="2" fill="#f4b6b6" stroke="#333" stroke-width="1"/>
<text x="370.0" y="768.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">retry</text>
<text x="370.0" y="782.5" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="370.0" y="796.5" font-size="11" fill="#000000" text-anchor="middle">저장 실패에만 붙인다</text>
<text x="370.0" y="810.5" font-size="11" fill="#000000" text-anchor="middle">승인과 실행에는 붙이지 않는다</text>
<text x="370.0" y="824.5" font-size="11" fill="#000000" text-anchor="middle">  승인을 자동 재시도하면 사용자에게 같은 질문을 반복하게 된다</text>
<rect x="730" y="735" width="650" height="115" rx="2" fill="#f4b6b6" stroke="#333" stroke-width="1"/>
<text x="1055.0" y="768.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">recovery  (재시작 / 장애 복구)</text>
<text x="1055.0" y="782.5" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="1055.0" y="796.5" font-size="11" fill="#000000" text-anchor="middle">재시작 시 진행 중이던 업무를 확인하고 이어서 처리한다</text>
<text x="1055.0" y="810.5" font-size="11" fill="#000000" text-anchor="middle">이전 승인만으로 변경을 자동 실행하지 않는다. 복구 시점에 다시 확인받는다</text>
<text x="1055.0" y="824.5" font-size="11" fill="#000000" text-anchor="middle">  꺼져 있는 동안 잔액과 카드 상태가 달라졌을 수 있다</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" font-family="Malgun Gothic, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#1f4e79">카드 상태 전이</text>
<path d="M430.0,120.0 V170.0 H180.0 V170.0 L180.0,220.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="305.0" y="167.0" font-size="10" fill="#c00" text-anchor="middle">일시 잠금</text>
<path d="M430.0,120.0 V170.0 H680.0 V170.0 L680.0,220.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="555.0" y="167.0" font-size="10" fill="#c00" text-anchor="middle">분실 신고</text>
<path d="M430.0,120.0 L430.0,340.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="430.0" y="227.0" font-size="10" fill="#c00" text-anchor="middle">해지</text>
<path d="M180.0,220.0 V170.0 H430.0 V170.0 L430.0,120.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="305.0" y="167.0" font-size="10" fill="#c00" text-anchor="middle">잠금 해제</text>
<path d="M270.0,245.0 L590.0,245.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="430.0" y="242.0" font-size="10" fill="#c00" text-anchor="middle">분실 신고</text>
<path d="M180.0,270.0 V305.0 H430.0 V305.0 L430.0,340.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="305.0" y="302.0" font-size="10" fill="#c00" text-anchor="middle">해지</text>
<rect x="340" y="70" width="180" height="50" rx="2" fill="#c6e0b4" stroke="#333" stroke-width="1"/>
<text x="430.0" y="92.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">active</text>
<text x="430.0" y="106.0" font-size="11" fill="#000000" text-anchor="middle">사용 가능 (초기값)</text>
<rect x="90" y="220" width="180" height="50" rx="2" fill="#f8cbad" stroke="#333" stroke-width="1"/>
<text x="180.0" y="242.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">locked</text>
<text x="180.0" y="256.0" font-size="11" fill="#000000" text-anchor="middle">일시 잠금</text>
<rect x="590" y="220" width="180" height="50" rx="2" fill="#f4b6b6" stroke="#333" stroke-width="1"/>
<text x="680.0" y="242.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">lost</text>
<text x="680.0" y="256.0" font-size="11" fill="#000000" text-anchor="middle">분실 및 정지</text>
<rect x="340" y="340" width="180" height="50" rx="2" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
<text x="430.0" y="362.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">cancelled</text>
<text x="430.0" y="376.0" font-size="11" fill="#000000" text-anchor="middle">해지됨</text>
<rect x="20" y="330" width="280" height="80" rx="2" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
<text x="160.0" y="346.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">불가 (불가 안내로 빠짐)</text>
<text x="160.0" y="360.0" font-size="11" fill="#000000" text-anchor="middle">lost -&gt; active  분실 정지는 해제 불가</text>
<text x="160.0" y="374.0" font-size="11" fill="#000000" text-anchor="middle">lost -&gt; locked</text>
<text x="160.0" y="388.0" font-size="11" fill="#000000" text-anchor="middle">cancelled -&gt; 무엇이든</text>
<text x="160.0" y="402.0" font-size="11" fill="#000000" text-anchor="middle">이미 같은 상태</text>
<rect x="560" y="340" width="320" height="70" rx="2" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
<text x="720.0" y="365.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">lost 상태에서만 재발급을 신청할 수 있다</text>
<text x="720.0" y="379.0" font-size="11" fill="#000000" text-anchor="middle">해지는 목록에서 지우지 않고 cancelled로 둔다</text>
<text x="720.0" y="393.0" font-size="11" fill="#000000" text-anchor="middle">(지우면 이용 내역이 참조를 잃는다)</text>
</svg>
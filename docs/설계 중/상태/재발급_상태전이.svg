<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" font-family="Malgun Gothic, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#1f4e79">재발급 신청 상태</text>
<path d="M260.0,130.0 L340.0,130.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="300.0" y="127.0" font-size="10" fill="#c00" text-anchor="middle">제작 시작</text>
<path d="M530.0,130.0 L610.0,130.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="570.0" y="127.0" font-size="10" fill="#c00" text-anchor="middle">발송</text>
<path d="M165.0,160.0 L165.0,230.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="165.0" y="192.0" font-size="10" fill="#c00" text-anchor="middle">취소</text>
<rect x="70" y="100" width="190" height="60" rx="2" fill="#c6e0b4" stroke="#333" stroke-width="1"/>
<text x="165.0" y="120.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">received</text>
<text x="165.0" y="134.0" font-size="11" fill="#000000" text-anchor="middle">접수</text>
<text x="165.0" y="148.0" font-size="11" fill="#000000" text-anchor="middle">수정·취소 가능</text>
<rect x="340" y="100" width="190" height="60" rx="2" fill="#f8cbad" stroke="#333" stroke-width="1"/>
<text x="435.0" y="120.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">making</text>
<text x="435.0" y="134.0" font-size="11" fill="#000000" text-anchor="middle">제작중</text>
<text x="435.0" y="148.0" font-size="11" fill="#000000" text-anchor="middle">수정·취소 불가</text>
<rect x="610" y="100" width="190" height="60" rx="2" fill="#f8cbad" stroke="#333" stroke-width="1"/>
<text x="705.0" y="120.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">shipping</text>
<text x="705.0" y="134.0" font-size="11" fill="#000000" text-anchor="middle">배송중</text>
<text x="705.0" y="148.0" font-size="11" fill="#000000" text-anchor="middle">수정·취소 불가</text>
<rect x="70" y="230" width="190" height="55" rx="2" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
<text x="165.0" y="254.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">cancelled</text>
<text x="165.0" y="268.5" font-size="11" fill="#000000" text-anchor="middle">취소됨</text>
<rect x="340" y="215" width="600" height="85" rx="2" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
<text x="640.0" y="233.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">신청 조건</text>
<text x="640.0" y="247.5" font-size="11" fill="#000000" text-anchor="middle">대상 카드가 lost 상태여야 한다</text>
<text x="640.0" y="261.5" font-size="11" fill="#000000" text-anchor="middle">취소되지 않은 기존 신청이 있으면 새로 만들지 않고 기존 신청을 안내한다</text>
<text x="640.0" y="275.5" font-size="11" fill="#000000" text-anchor="middle">신청을 접수해도 기존 카드의 분실 정지는 그대로 유지한다</text>
<text x="640.0" y="289.5" font-size="11" fill="#000000" text-anchor="middle">제작중·배송중 상태는 테스트 데이터로 미리 만들어 제한 동작을 확인한다</text>
</svg>
<text x="905.0" y="155.0" font-size="11" fill="#000000" text-anchor="middle">처리 규칙</text>
<text x="905.0" y="169.0" font-size="11" fill="#000000" text-anchor="middle">거래 내역에 출금 1건 + 입금 1건 기록</text>

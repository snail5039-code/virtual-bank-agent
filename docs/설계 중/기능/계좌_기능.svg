<text x="905.0" y="261.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">규칙</text>
<text x="905.0" y="275.5" font-size="11" fill="#000000" text-anchor="middle">기준일은 상수로 정한다</text>
<text x="905.0" y="289.5" font-size="11" fill="#000000" text-anchor="middle">이번 달 = 기준일이 속한 달</text>
<text x="905.0" y="303.5" font-size="11" fill="#000000" text-anchor="middle">이번 주 = 월 ~ 일</text>
<text x="905.0" y="317.5" font-size="11" fill="#000000" text-anchor="middle">기간은 시작일·종료일 포함</text>
<text x="905.0" y="331.5" font-size="11" fill="#000000" text-anchor="middle">카드 결제 건은 사용 카드도 표시</text>

<text x="605.0" y="481.5" font-size="11" fill="#000000" text-anchor="middle">계좌 등록 / 조회 / 삭제</text>
<rect x="760" y="370" width="290" height="125" rx="2" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
<text x="905.0" y="394.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">분기 조건</text>
<text x="905.0" y="408.5" font-size="11" fill="#000000" text-anchor="middle">이름 길이 초과·미달 -&gt; 불가</text>
<text x="905.0" y="422.5" font-size="11" fill="#000000" text-anchor="middle">같은 소유자 내 이름 중복 -&gt; 불가</text>
<text x="905.0" y="436.5" font-size="11" fill="#000000" text-anchor="middle">은행명+계좌번호 이미 등록 -&gt; 기존 안내</text>
<text x="905.0" y="450.5" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="905.0" y="464.5" font-size="11" fill="#000000" text-anchor="middle">등록 시 은행명을 함께 받는다</text>
<text x="905.0" y="478.5" font-size="11" fill="#000000" text-anchor="middle">(자행·타행 같은 방식)</text>

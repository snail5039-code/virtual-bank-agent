<text x="615.0" y="151.5" font-size="11" fill="#000000" text-anchor="middle">실 카드 번호 조회 (전체)</text>
<rect x="500" y="174" width="230" height="33" rx="2" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="615.0" y="194.5" font-size="11" fill="#000000" text-anchor="middle">멤버십 조회</text>
<rect x="500" y="217" width="230" height="33" rx="2" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="615.0" y="237.5" font-size="11" fill="#000000" text-anchor="middle">이용 내역 조회</text>
<rect x="780" y="45" width="280" height="205" rx="2" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
<text x="920.0" y="102.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">규칙</text>
<text x="920.0" y="116.5" font-size="11" fill="#000000" text-anchor="middle">조회 결과에 반드시 상태를 포함한다</text>
<text x="920.0" y="130.5" font-size="11" fill="#000000" text-anchor="middle">카드 번호는 마스킹하지 않는다</text>
<text x="920.0" y="144.5" font-size="11" fill="#000000" text-anchor="middle">(본인 인증을 거친 세션)</text>
<text x="920.0" y="158.5" font-size="11" fill="#000000" text-anchor="middle">인증 안 됐으면 인증 먼저</text>
<text x="920.0" y="172.5" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="920.0" y="186.5" font-size="11" fill="#000000" text-anchor="middle">이용 내역은 계좌 거래내역 함수를</text>
<text x="920.0" y="200.5" font-size="11" fill="#000000" text-anchor="middle">카드 필터만 추가해 재사용</text>
<rect x="500" y="275" width="230" height="33" rx="2" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="615.0" y="295.5" font-size="11" fill="#000000" text-anchor="middle">요금 조회</text>

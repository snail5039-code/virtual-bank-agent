<text x="615.0" y="510.5" font-size="11" fill="#000000" text-anchor="middle">일괄 결제 (여러 장)</text>
<rect x="780" y="275" width="280" height="248" rx="2" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
<text x="920.0" y="326.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">결제 방식 4가지</text>
<text x="920.0" y="340.0" font-size="11" fill="#000000" text-anchor="middle">전체 : 총액 전부</text>
<text x="920.0" y="354.0" font-size="11" fill="#000000" text-anchor="middle">부분 : 지금 일부만 (회차 없음)</text>
<text x="920.0" y="368.0" font-size="11" fill="#000000" text-anchor="middle">분할 : 앞으로 N개월 (회차 생김)</text>
<text x="920.0" y="382.0" font-size="11" fill="#000000" text-anchor="middle">일괄 : 여러 장 한 번에</text>
<text x="920.0" y="396.0" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="920.0" y="410.0" font-size="11" fill="#000000" text-anchor="middle">저장 규칙</text>
<text x="920.0" y="424.0" font-size="11" fill="#000000" text-anchor="middle">전체·부분·분할 : 한 번에 저장</text>
<text x="920.0" y="438.0" font-size="11" fill="#000000" text-anchor="middle">  하나 실패하면 전부 롤백</text>
<text x="920.0" y="452.0" font-size="11" fill="#000000" text-anchor="middle">일괄 : 건별 저장</text>
<text x="920.0" y="466.0" font-size="11" fill="#000000" text-anchor="middle">  2건째 실패해도 1건째는 유지</text>
<text x="920.0" y="480.0" font-size="11" fill="#000000" text-anchor="middle">* 나눠 이체와 정확히 반대</text>

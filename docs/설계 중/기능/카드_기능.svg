<text x="615.0" y="621.5" font-size="11" fill="#000000" text-anchor="middle">분실 신고 (분실 및 정지)</text>
<rect x="500" y="644" width="230" height="33" rx="2" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="615.0" y="664.5" font-size="11" fill="#000000" text-anchor="middle">일시 잠금 / 잠금 해제</text>
<rect x="500" y="687" width="230" height="33" rx="2" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="615.0" y="707.5" font-size="11" fill="#000000" text-anchor="middle">별칭 변경</text>
<rect x="500" y="730" width="230" height="33" rx="2" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="615.0" y="750.5" font-size="11" fill="#000000" text-anchor="middle">재발급 신청 / 신청 조회</text>
<rect x="500" y="773" width="230" height="33" rx="2" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="615.0" y="793.5" font-size="11" fill="#000000" text-anchor="middle">배송지 수정 / 신청 취소</text>
<rect x="780" y="555" width="280" height="218" rx="2" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
<text x="920.0" y="591.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">카드 상태</text>
<text x="920.0" y="605.0" font-size="11" fill="#000000" text-anchor="middle">active 사용가능 / locked 일시잠금</text>
<text x="920.0" y="619.0" font-size="11" fill="#000000" text-anchor="middle">lost 분실정지 / cancelled 해지</text>
<text x="920.0" y="633.0" font-size="11" fill="#000000" text-anchor="middle">* 분실·도난·부정사용은 모두 lost</text>
<text x="920.0" y="647.0" font-size="11" fill="#000000" text-anchor="middle">  사유만 따로 기록</text>
<text x="920.0" y="661.0" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="920.0" y="675.0" font-size="11" fill="#000000" text-anchor="middle">신청 상태</text>
<text x="920.0" y="689.0" font-size="11" fill="#000000" text-anchor="middle">received 접수 - 수정·취소 가능</text>
<text x="920.0" y="703.0" font-size="11" fill="#000000" text-anchor="middle">making 제작중 / shipping 배송중</text>
<text x="920.0" y="717.0" font-size="11" fill="#000000" text-anchor="middle">  - 수정·취소 불가</text>
<text x="920.0" y="731.0" font-size="11" fill="#000000" text-anchor="middle"></text>
<text x="920.0" y="745.0" font-size="11" fill="#000000" text-anchor="middle">정지 후 재발급은 승인을 따로 두 번 받는다</text>

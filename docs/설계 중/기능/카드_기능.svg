<text x="615.0" y="535.5" font-size="11" fill="#000000" text-anchor="middle">카드 등록 / 해지</text>
<rect x="500" y="558" width="230" height="33" rx="2" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="615.0" y="578.5" font-size="11" fill="#000000" text-anchor="middle">비밀번호 변경</text>

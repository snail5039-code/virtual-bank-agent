<path d="M480.0,985.0 L480.0,1020.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M480.0,1055.0 L480.0,1075.0" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#ar)"/>

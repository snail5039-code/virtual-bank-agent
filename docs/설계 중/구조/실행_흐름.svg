<text x="295.0" y="507.0" font-size="10" fill="#c00" text-anchor="middle">다음 입력은 분기 0으로 돌아온다</text>
<rect x="360" y="55" width="240" height="40" rx="2" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
<text x="480.0" y="79.0" font-size="11" fill="#000000" text-anchor="middle">입력 (자연어)</text>
<rect x="340" y="120" width="280" height="50" rx="2" fill="#f8cbad" stroke="#333" stroke-width="1"/>
<text x="480.0" y="142.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">[분기 0]</text>
<text x="480.0" y="156.0" font-size="11" fill="#000000" text-anchor="middle">승인 대기 중인 업무가 있는가?</text>
<rect x="720" y="105" width="400" height="115" rx="2" fill="#c6e0b4" stroke="#333" stroke-width="1"/>
<text x="920.0" y="145.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">있음 -&gt; 응답 해석 (승인 / 거절 / 취소 / 수정)</text>
<text x="920.0" y="159.5" font-size="11" fill="#000000" text-anchor="middle">승인 : 멈춘 자리에서 재개</text>
<text x="920.0" y="173.5" font-size="11" fill="#000000" text-anchor="middle">거절·취소 : 변경 없이 종료</text>
<text x="920.0" y="187.5" font-size="11" fill="#000000" text-anchor="middle">수정 : 처리안 갱신 -&gt; 전체 내용 다시 제시 -&gt; 재승인</text>
<rect x="360" y="215" width="240" height="50" rx="8" fill="#1f4e79" stroke="#333" stroke-width="1"/>
<text x="480.0" y="237.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Supervisor</text>
<text x="480.0" y="251.0" font-size="11" fill="#ffffff" text-anchor="middle">1단 분류 : 계좌 / 카드</text>
<rect x="340" y="300" width="280" height="50" rx="8" fill="#2e75b6" stroke="#333" stroke-width="1"/>
<text x="480.0" y="329.0" font-size="11" fill="#ffffff" text-anchor="middle">도메인 Agent (2단 분류)</text>
<rect x="720" y="295" width="340" height="60" rx="2" fill="#f4b6b6" stroke="#333" stroke-width="1"/>
<text x="890.0" y="315.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">내 도메인 아님</text>
<text x="890.0" y="329.0" font-size="11" fill="#000000" text-anchor="middle">-&gt; Supervisor 반송 후 재분류 (1회까지)</text>
<text x="890.0" y="343.0" font-size="11" fill="#000000" text-anchor="middle">-&gt; 재분류도 실패하면 불가 안내</text>
<rect x="360" y="385" width="240" height="45" rx="2" fill="#bdd7ee" stroke="#333" stroke-width="1"/>
<text x="480.0" y="411.5" font-size="11" fill="#000000" text-anchor="middle">기능 Agent (3단 분류)</text>
<rect x="340" y="465" width="280" height="50" rx="2" fill="#f8cbad" stroke="#333" stroke-width="1"/>
<text x="480.0" y="487.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">[분기 1]</text>
<text x="480.0" y="501.0" font-size="11" fill="#000000" text-anchor="middle">필요한 정보가 모두 있는가?</text>
<rect x="720" y="460" width="340" height="60" rx="2" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
<text x="890.0" y="480.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">없음 -&gt; 부족 정보 질문</text>
<text x="890.0" y="494.0" font-size="11" fill="#000000" text-anchor="middle">후보가 여러 개면 목록 제시 후 선택</text>
<text x="890.0" y="508.0" font-size="11" fill="#000000" text-anchor="middle">답변 -&gt; 분기 1로 복귀</text>
<rect x="340" y="550" width="280" height="50" rx="2" fill="#f8cbad" stroke="#333" stroke-width="1"/>
<text x="480.0" y="572.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">[분기 2]</text>
<text x="480.0" y="586.0" font-size="11" fill="#000000" text-anchor="middle">실행 가능한 요청인가?</text>
<rect x="720" y="550" width="340" height="50" rx="2" fill="#f4b6b6" stroke="#333" stroke-width="1"/>
<text x="890.0" y="572.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">불가 -&gt; 사유 안내 후 종료</text>
<text x="890.0" y="586.0" font-size="11" fill="#000000" text-anchor="middle">(데이터 변경 없음)</text>
<rect x="340" y="635" width="280" height="50" rx="2" fill="#f8cbad" stroke="#333" stroke-width="1"/>
<text x="480.0" y="657.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">[분기 3]</text>
<text x="480.0" y="671.0" font-size="11" fill="#000000" text-anchor="middle">데이터를 변경하는 업무인가?</text>
<rect x="720" y="635" width="340" height="50" rx="2" fill="#c6e0b4" stroke="#333" stroke-width="1"/>
<text x="890.0" y="657.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">아니오 (조회)</text>
<text x="890.0" y="671.0" font-size="11" fill="#000000" text-anchor="middle">-&gt; 실행 -&gt; 결과 반환</text>
<rect x="380" y="720" width="200" height="40" rx="2" fill="#fff2cc" stroke="#333" stroke-width="1"/>
<text x="480.0" y="744.0" font-size="11" fill="#000000" text-anchor="middle">인증 (세션 단위)</text>
<rect x="380" y="785" width="200" height="40" rx="2" fill="#fff2cc" stroke="#333" stroke-width="1"/>
<text x="480.0" y="809.0" font-size="11" fill="#000000" text-anchor="middle">처리안 제시</text>
<rect x="360" y="850" width="240" height="50" rx="2" fill="#fff2cc" stroke="#333" stroke-width="1"/>
<text x="480.0" y="872.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">승인 요청 (interrupt)</text>
<text x="480.0" y="886.0" font-size="11" fill="#000000" text-anchor="middle">* 이 노드에는 부작용을 두지 않는다</text>
<rect x="360" y="935" width="240" height="50" rx="2" fill="#fff2cc" stroke="#333" stroke-width="1"/>
<text x="480.0" y="957.0" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">실행 직전 재검증</text>
<text x="480.0" y="971.0" font-size="11" fill="#000000" text-anchor="middle">달라졌으면 재승인 / 재요청 안내</text>
<rect x="380" y="1020" width="200" height="35" rx="2" fill="#bdd7ee" stroke="#333" stroke-width="1"/>
<text x="480.0" y="1041.5" font-size="11" fill="#000000" text-anchor="middle">실행</text>
<rect x="380" y="1075" width="200" height="35" rx="2" fill="#fff2cc" stroke="#333" stroke-width="1"/>
<text x="480.0" y="1096.5" font-size="11" fill="#000000" text-anchor="middle">저장</text>
<rect x="720" y="1020" width="340" height="75" rx="2" fill="#f4b6b6" stroke="#333" stroke-width="1"/>
<text x="890.0" y="1040.5" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">[분기 4] 실행 / 저장 실패</text>
<text x="890.0" y="1054.5" font-size="11" fill="#000000" text-anchor="middle">-&gt; 변경 전 상태 유지</text>
<text x="890.0" y="1068.5" font-size="11" fill="#000000" text-anchor="middle">-&gt; 사유 안내</text>
<text x="890.0" y="1082.5" font-size="11" fill="#000000" text-anchor="middle">(저장 실패에만 retry)</text>
<rect x="340" y="1130" width="280" height="40" rx="8" fill="#1f4e79" stroke="#333" stroke-width="1"/>
<text x="480.0" y="1154.0" font-size="11" fill="#ffffff" text-anchor="middle">Supervisor 최종 문장 정리 -&gt; 출력</text>
</svg>